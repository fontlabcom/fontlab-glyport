# this_file: src_docs/mkdocs.yml
site_name: Glyport
site_description: Glyport public contracts and complete maintained guides.
site_url: https://fontlabcom.github.io/fontlab-glyport/
repo_url: https://github.com/fontlabcom/fontlab-glyport
repo_name: fontlabcom/fontlab-glyport
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: materialx
  language: en
  custom_dir: overrides
  palette:
    scheme: default
  features:
    - search.highlight
    - content.code.copy
plugins:
  - search:
      lang: [en]
markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Index: index.md
  - Installation: installation.md
  - Glyphs Cocoa And Vanilla: glyphs-cocoa-and-vanilla.md
  - Development And Limits: development-and-limits.md
  - Licence: licence.md
  - Complete maintained guides:
      - COMPATIBILITY: guides/COMPATIBILITY.md
      - GLYPH_INFO_MANAGER: guides/GLYPH_INFO_MANAGER.md
      - LAYER_IDENTITIES: guides/LAYER_IDENTITIES.md
      - arabic-presentation: guides/arabic-presentation.md
      - custom-parameters: guides/custom-parameters.md
      - glyph-descriptions: guides/glyph-descriptions.md
      - legacy-and-ros: guides/legacy-and-ros.md
      - production-metadata: guides/production-metadata.md
      - unicode-lookup: guides/unicode-lookup.md
extra_css:
  - stylesheets/local.css
  - https://i.fontlab.com/fltheme26/1.0.0/components.css
  - https://i.fontlab.com/fltheme26/1.0.0/theme.css
extra_javascript:
  - https://i.fontlab.com/fltheme26/1.0.0/basecoat.js
  - https://i.fontlab.com/fltheme26/1.0.0/theme.js
hooks:
  - english_search.py
